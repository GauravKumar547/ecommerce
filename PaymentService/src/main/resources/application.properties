spring.application.name=payment-service
server.port=8003

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_payments
spring.datasource.username=admin
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Eureka Configuration
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# OpenAPI Configuration
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/docs/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY:your_stripe_test_key_here}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:your_stripe_webhook_secret_here}

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.org.ecommerce.paymentservice=DEBUG

razorpay.key.id:000
razorpay.key.secret:000
stripe.key=000

